name: gitea

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  gitea:
    image: docker.gitea.com/gitea:${GITEA_TAG:-28.0.0}
    container_name: gitea
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Europe/Athens}"
      # Server
      GITEA__server__DOMAIN: "${DOMAIN:?DOMAIN is required}"
      GITEA__server__ROOT_URL: "https://${DOMAIN}/"
      GITEA__server__SSH_DOMAIN: "${DOMAIN}"
      # Port shown in clone URLs — must match the published host port below.
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:?GITEA_SSH_PORT is required}"
      # Database (password read from the secret file, not an env var)
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: database:5432
      GITEA__database__NAME: "${POSTGRES_DB:-gitea}"
      GITEA__database__USER: "${POSTGRES_USER:-gitea}"
      GITEA__database__PASSWD__FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      # Git over SSH goes straight to Gitea — Traefik and its IP allowlist don't apply.
      # Docker-published ports also bypass ufw; restrict via DOCKER-USER or a bind IP.
      - "${GITEA_SSH_BIND:-0.0.0.0}:${GITEA_SSH_PORT}:22"
    volumes:
      - data:/data
      - packages:/data/gitea/packages
    networks:
      - gitea
      - database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${GITEA_CPU_LIMIT:-2}"
          # noinspection ComposeUnknownValues
          memory: "${GITEA_MEM_LIMIT:-1G}"
          # noinspection ComposeUnknownValues
          pids: ${GITEA_PIDS_LIMIT:-1024}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${GITEA_MEM_RESERVATION:-256M}"
    labels:
      - "traefik.enable=true"
      # Router (TLS comes from the websecure entrypoint's wildcard default)
      - "traefik.http.routers.gitea.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.service=gitea"
      - "traefik.http.routers.gitea.middlewares=gitea-ipallowlist,gitea-path"
      # Middlewares
      - "traefik.http.middlewares.gitea-ipallowlist.ipallowlist.sourcerange=${IPV4_ALLOWLIST:-0.0.0.0/0},${IPV6_ALLOWLIST:-::/0}"
      # %2F: npm scoped packages (@scope%2Fname) in the package registry.
      # %25: files and refs whose names contain "%".
      - "traefik.http.middlewares.gitea-path.encodedcharacters.allowencodedslash=true"
      - "traefik.http.middlewares.gitea-path.encodedcharacters.allowencodedpercent=true"
      # Service
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"

  database:
    image: postgres:${POSTGRES_TAG:-18.6-alpine}
    container_name: gitea-database
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    # Docker's 64 MB default /dev/shm is too small for Postgres parallel queries.
    shm_size: 128m
    environment:
      TZ: "${TZ:-Europe/Athens}"
      POSTGRES_DB: "${POSTGRES_DB:-gitea}"
      POSTGRES_USER: "${POSTGRES_USER:-gitea}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${DATABASE_CPU_LIMIT:-1}"
          # noinspection ComposeUnknownValues
          memory: "${DATABASE_MEM_LIMIT:-512M}"
          # noinspection ComposeUnknownValues
          pids: ${DATABASE_PIDS_LIMIT:-256}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${DATABASE_MEM_RESERVATION:-256M}"

networks:
  gitea:
    name: gitea
  database:
    name: gitea_database
    internal: true

volumes:
  data:
    name: gitea-data
  packages:
    name: gitea-packages
    driver: local
    driver_opts:
      type: "${PACKAGES_MOUNT_TYPE:?PACKAGES_MOUNT_TYPE is required}"
      o: "${PACKAGES_MOUNT_O:?PACKAGES_MOUNT_O is required}"
      device: "${PACKAGES_MOUNT_DEVICE:?PACKAGES_MOUNT_DEVICE is required}"
  database-data:
    name: gitea-database-data

secrets:
  postgres-password:
    environment: POSTGRES_PASSWORD